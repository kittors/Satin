<!doctype html>
<html lang="zh-CN" data-theme="light">
<head><meta charset="utf-8"><title>Markdown XSS 测试</title>
<link rel="stylesheet" href="../packages/satin-ui/css/tokens.css"><link rel="stylesheet" href="../packages/satin-ui/css/base.css"><link rel="stylesheet" href="../packages/satin-ui/css/md.css">
<script>window.__xss = []; window.alert = (x) => window.__xss.push("alert " + x); window.prompt = window.confirm = window.alert;</script>
</head>
<body><div id="out"></div>
<script type="module">
import { renderMarkdown } from "../packages/satin-ui/src/markdown.js";
window.render = (md) => { const el = document.createElement("div"); document.getElementById("out").append(el); renderMarkdown(el, md); return el; };
window.ready = true;
</script>
</body></html>
