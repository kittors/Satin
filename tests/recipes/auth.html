<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>配方 · 登录 / 注册</title>
<link rel="icon" href="data:,">
<script src="../../packages/satin-ui/src/theme-boot.js"></script>
<link rel="stylesheet" href="../../packages/satin-ui/css/page.css">
<script type="importmap">{"imports":{"satin-ui":"../../packages/satin-ui/src/index.js","satin-ui/components":"../../packages/satin-ui/src/components.js","satin-ui/elements":"../../packages/satin-ui/elements/index.js","satin-ui/theme":"../../packages/satin-ui/src/theme.js","satin-ui/charts":"../../packages/satin-ui/src/charts.js","satin-ui/chat":"../../packages/satin-ui/src/chat.js","satin-ui/markdown":"../../packages/satin-ui/src/markdown.js"}}</script>
</head>
<body>
<main class="sn-auth">
  <div class="sn-panel">
    <h1>登录分镜工作台</h1>
    <p>用工作邮箱登录，团队成员会自动加入你的空间。</p>
    <form class="sn-form" novalidate>
      <div class="sn-field" data-f="mail"><label class="sn-lbl" for="l-mail">邮箱</label><input class="sn-input sn-lg" id="l-mail" type="email" autocomplete="email" placeholder="name@company.com"><div class="sn-err"><span></span></div></div>
      <div class="sn-field" data-f="pwd">
        <label class="sn-lbl" for="l-pwd">密码 <a class="sn-aside sn-link" href="/forgot">忘记密码？</a></label>
        <span class="sn-ib sn-has-post"><input class="sn-input sn-lg" id="l-pwd" type="password" autocomplete="current-password"><span class="sn-post"><button type="button" class="sn-eye" data-eye aria-label="显示密码"><span class="sn-swap"><span class="sn-a" data-i="eye"></span><span class="sn-b" data-i="eye-off"></span></span></button></span></span>
        <div class="sn-err"><span></span></div>
      </div>
      <label class="sn-check"><input type="checkbox" checked><span class="sn-box"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.2l2.4 2.4 4.6-5"/></svg><span class="sn-bar"></span></span>30&nbsp;天内保持登录</label>
      <button class="sn-btn sn-primary sn-lg" type="submit" style="width: 100%">登录</button>
    </form>
    <p class="sn-auth-ft">还没有账号？<a class="sn-link" href="/signup">注册</a></p>
  </div>
</main>
<script type="module">
import { setup, enhance } from "satin-ui";
import { toast } from "satin-ui/components";
import { defineElements } from "satin-ui/elements";
setup(); defineElements(); enhance();
/* satin-preview-guard:start */
// 配方预览沙箱保护：拦截占位站内链接与 iframe 内误退父页，避免点击示例路由（/signup、/pricing、/projects 等）在静态预览里报 404
document.addEventListener("click", (e) => {
  if (e.defaultPrevented) return;
  const back = e.target.closest?.("[data-nf-back]");
  if (back && window !== window.top) { e.preventDefault(); e.stopImmediatePropagation(); toast({ text: "预览演示 · 返回上一页", tone: "info" }); return; }
  const a = e.target.closest?.("a[href]");
  if (!a || a.target === "_blank" || a.hasAttribute("download")) return;
  const href = a.getAttribute("href") || "";
  if (/^(?:https?:|mailto:|tel:|javascript:)/i.test(href)) return;
  e.preventDefault();
  if (href.startsWith("#")) {
    if (href.length > 1) document.getElementById(href.slice(1))?.scrollIntoView({ behavior: "smooth", block: "start" });
    return;
  }
  if (a.closest(".sn-side-nav, .sn-tabbar")) {
    for (const nav of document.querySelectorAll(".sn-side-nav, .sn-tabbar")) {
      for (const item of nav.querySelectorAll("a[href]")) {
        const on = item.getAttribute("href") === href;
        item.classList.toggle("sn-on", on);
        if (on) item.setAttribute("aria-current", "page"); else item.removeAttribute("aria-current");
      }
    }
    const label = a.querySelector(".sn-lbl")?.textContent?.trim() || a.textContent.trim();
    if (label) toast({ text: "预览演示 · 已切换至「" + label + "」", tone: "info" });
    return;
  }
  toast({ text: "预览演示 · 目标路由 " + href, tone: "info" });
}, true);
document.addEventListener("submit", (e) => { if (!e.defaultPrevented) { e.preventDefault(); toast({ text: "预览演示 · 表单已提交", tone: "info" }); } });
/* satin-preview-guard:end */
document.documentElement.dataset.ready = "1";
</script>
</body>
</html>
