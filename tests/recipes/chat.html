<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>配方 · AI 对话</title>
<link rel="icon" href="data:,">
<script src="../../packages/satin-ui/src/theme-boot.js"></script>
<link rel="stylesheet" href="../../packages/satin-ui/css/page.css">
<script type="importmap">{"imports":{"satin-ui":"../../packages/satin-ui/src/index.js","satin-ui/components":"../../packages/satin-ui/src/components.js","satin-ui/elements":"../../packages/satin-ui/elements/index.js","satin-ui/theme":"../../packages/satin-ui/src/theme.js","satin-ui/charts":"../../packages/satin-ui/src/charts.js","satin-ui/chat":"../../packages/satin-ui/src/chat.js","satin-ui/markdown":"../../packages/satin-ui/src/markdown.js"}}</script>
</head>
<body>
<!-- 对话框自己带顶栏（会话列表、标题、新对话）：外面不要再放一个写着同样名字的页头 -->
<div class="sn-page sn-wide sn-screen">
  <div id="chat"></div>
</div>
<script type="module">
  import { setup } from "satin-ui";
  import { createChat } from "satin-ui/chat";
  setup();
  // 空容器：createChat 按选项填好标记（顶栏、消息区、底部输入框都接好了）。respond 返回异步迭代的文字片段（流式），或者直接返回一整段
  createChat(document.getElementById("chat"), {
    title: "分镜助手", placeholder: "和分镜助手一起改这一集",
    menu: true, newChat: true, // 顶栏左边"会话列表"、右边"新对话"（单色细线图标）
    onMenu() { /* 自己接：打开会话列表（手机上用 openDrawer 从左边拉出来） */ },
    onNewChat() { /* 自己接：开一段新对话（换一个会话、清空消息） */ },
    respond: (() => {
      // 演示用的回答（真用时换成你的接口）：按说的事给不同的回答；说的和分镜无关就问要改哪一场；同一句不连着说两遍，不用客套开头
      const TOPICS = [
        [/雨|冷|暖|色|灯/, ["开头三个镜头的色温降到 5200K，路灯改成冷白，积水里的倒影也跟着偏蓝了。", "候车厅的暖光压了一档，和外面的冷色对比更明显。"]],
        [/拆|镜头|分镜|场/, ["这一场拆成三个镜头：远景站台、林夏的中景、车灯穿过雨幕的特写。", "第三集一共 12 个镜头：车站外 3 个、候车厅 5 个、站台 4 个。"]],
        [/慢|快|节奏|时长|秒/, ["候车厅那段从 18 秒放到 24 秒，第 6 个镜头加了一个收伞的停顿。", "第 2 个镜头从 6 秒剪到 4 秒，雨刚停的那一下留着。"]],
        [/结尾|结局|最后/, ["结尾改成车门关上、她站在原地，最后停在空站台，留 3 秒黑场。", "结尾的空站台多留 2 秒，车灯远去以后再黑场。"]],
        [/配音|声|音乐|旁白/, ["旁白换成温柔一点的女声，语速放慢 10%；下雨的段落音乐压低 6 分贝。", "车进站前 2 秒音乐再起来，雨声一直留着。"]],
        [/字幕|片名|标题/, ["字幕改成 24 号，离画面底边留 8%；片名放在第一个远景上，2 秒淡入。"]],
      ];
      const ASK = ["要改哪一场？车站外、候车厅还是站台？", "想先动哪一段：开头的雨夜、候车厅，还是结尾？"];
      let last = "";
      return async function* (text) {
        const pool = (TOPICS.find(([re]) => re.test(text)) || [, ASK])[1];
        const reply = pool.find((r) => r !== last) || ASK.find((r) => r !== last);
        last = reply;
        await new Promise((r) => setTimeout(r, 600)); // 假装在等模型：这段时间消息区里是"正在思考"的三个点
        for (const ch of reply) { await new Promise((r) => setTimeout(r, 30)); yield ch; }
      };
    })(),
  });
</script>
<script type="module">
import { setup, enhance } from "satin-ui";
import { defineElements } from "satin-ui/elements";
setup(); defineElements(); enhance();
document.documentElement.dataset.ready = "1";
</script>
</body>
</html>
