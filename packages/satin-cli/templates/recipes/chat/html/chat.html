<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI 对话</title>
<script src="/node_modules/satin-ui/src/theme-boot.js"></script>
<link rel="stylesheet" href="/node_modules/satin-ui/css/page.css">
<script type="importmap">{"imports":{"satin-ui":"/node_modules/satin-ui/src/index.js","satin-ui/components":"/node_modules/satin-ui/src/components.js","satin-ui/elements":"/node_modules/satin-ui/elements/index.js","satin-ui/theme":"/node_modules/satin-ui/src/theme.js","satin-ui/chat":"/node_modules/satin-ui/src/chat.js","satin-ui/markdown":"/node_modules/satin-ui/src/markdown.js"}}</script>
</head>
<body>
<!-- 对话框自己带顶栏（名字、状态、条数）：外面不要再放一个写着同样名字的页头 -->
<div class="sn-page sn-wide" style="height: 100dvh; padding-block: var(--sn-sp-16)">
  <div id="chat" style="height: 100%"></div>
</div>
<script type="module">
  import { setup } from "satin-ui";
  import { createChat } from "satin-ui/chat";
  setup();
  // 空容器：createChat 按选项填好标记（顶栏、消息区、底部输入框都接好了）。respond 返回异步迭代的文字片段（流式），或者直接返回一整段
  createChat(document.getElementById("chat"), {
    title: "分镜助手", placeholder: "和分镜助手一起改这一集",
    async *respond(text) {
      const reply = "好的。第 3 场的雨夜可以拆成三个镜头：远景站台、林夏的中景、车灯穿过雨幕的特写。";
      for (const ch of reply) { await new Promise((r) => setTimeout(r, 30)); yield ch; }
    },
  });
</script>
<script type="module">
import { setup, enhance } from "satin-ui";
import { defineElements } from "satin-ui/elements";
setup(); defineElements(); enhance();
document.documentElement.dataset.ready = "1";
</script>
</body>
</html>
