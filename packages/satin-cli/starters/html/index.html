<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- 第一帧之前写好深浅主题、圆角（刷新不闪）：放在 <head> 最前面 -->
<script src="/node_modules/satin-ui/src/theme-boot.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>新建项目</title>
<link rel="stylesheet" href="/node_modules/satin-ui/css/page.css">
<!-- 不用打包工具：浏览器按这张表把 "satin-ui/…" 找到 node_modules 里 -->
<script type="importmap">
{ "imports": {
  "satin-ui": "/node_modules/satin-ui/src/index.js",
  "satin-ui/components": "/node_modules/satin-ui/src/components.js",
  "satin-ui/elements": "/node_modules/satin-ui/elements/index.js",
  "satin-ui/theme": "/node_modules/satin-ui/src/theme.js"
} }
</script>
</head>
<body>
<!-- 起步页：页头 + 一张面板（名称、默认视图、创建按钮）。有交互的组件用自定义元素 <sn-xxx>，数组属性写成 JSON -->
<main class="sn-page sn-narrow">
  <header class="sn-page-hd">
    <div>
      <h1>新建项目</h1>
      <p>起个名字、选一种默认视图，就能开始。</p>
    </div>
  </header>
  <section class="sn-panel sn-stack sn-gap-20">
    <div class="sn-field">
      <label class="sn-lbl" for="p-name">项目名称</label>
      <input class="sn-input" id="p-name" placeholder="比如：春季新品发布">
      <div class="sn-help">之后在项目设置里还能改。</div>
    </div>
    <div class="sn-field">
      <span class="sn-lbl">默认视图</span>
      <sn-segmented items='["网格", "列表", "时间线"]' value="网格" label="默认视图"></sn-segmented>
    </div>
    <div class="sn-row">
      <button class="sn-btn sn-primary" type="button" id="create">创建项目</button>
    </div>
  </section>
</main>
<script type="module" src="/main.js"></script>
</body>
</html>
