<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>好页面（检查器自测用）：只用 Satin 的类和令牌</title>
<link rel="stylesheet" href="../../../../../packages/satin-ui/css/tokens.css">
<link rel="stylesheet" href="../../../../../packages/satin-ui/css/reset.css">
<link rel="stylesheet" href="../../../../../packages/satin-ui/css/base.css">
<link rel="stylesheet" href="../../../../../packages/satin-ui/css/buttons.css">
<link rel="stylesheet" href="../../../../../packages/satin-ui/css/form.css">
<link rel="stylesheet" href="../../../../../packages/satin-ui/css/feedback.css">
<style>
.page { max-width: 720px; margin: 0 auto; padding: var(--sn-pad-page) var(--sn-gap-group); display: grid; gap: var(--sn-gap-section); }
.top { display: flex; align-items: center; gap: var(--sn-gap-group); }
.top .sn-t-title1 { flex: 1; }
.form { display: grid; gap: var(--sn-gap-group); padding: var(--sn-pad-card); border-radius: var(--sn-r-lg); background: var(--sn-raised); box-shadow: var(--sn-card-shadow); }
.acts { display: flex; flex-wrap: wrap; gap: var(--sn-gap-stack); }
.meta { color: var(--sn-label2); }
</style>
</head>
<body>
<div class="page">
  <div class="top">
    <h1 class="sn-t-title1">雨夜车站</h1>
    <button class="sn-btn sn-secondary">导入原文</button>
  </div>
  <p class="sn-t-callout meta">3 集 · 12 个段落 · 13 个素材，最后修改 3 分钟前</p>
  <div class="form">
    <div class="sn-field"><label class="sn-lbl" for="t">镜头标题</label><input class="sn-input" id="t" placeholder="一句话说清这个镜头"><div class="sn-help">写清楚人物、动作和光线，生成会更准。</div></div>
    <div class="sn-field"><span class="sn-lbl">画面比例</span><div id="ratio"></div></div>
    <div class="acts"><button class="sn-btn sn-primary">保存修改</button><button class="sn-btn sn-ghost">取消</button></div>
  </div>
</div>
<script type="module">
import { createSelect } from "../../../../../packages/satin-ui/src/components.js";
import { setup } from "../../../../../packages/satin-ui/src/setup.js";
setup();
createSelect(document.getElementById("ratio"), { items: ["16:9 · 横屏", "9:16 · 竖屏", "1:1 · 方形"], value: "16:9 · 横屏" });
</script>
</body>
</html>
