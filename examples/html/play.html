<style>html { overflow: hidden; } html, body { background: transparent !important; } .play { padding: 28px 24px; box-sizing: border-box; } .play.flush { padding: 0; } .play.flush .sn-app, .play.flush .sn-chat, .play.flush .sn-flow, .play.flush .sn-tree, .play.flush .sn-fex { border-radius: 0; box-shadow: none; } .play.flush .sn-chat::after { display: none; } .play.center > sn-enhance > * { margin-inline: auto; } /* 演示舞台居中与合理宽度：小控件水平+垂直居中，表单单控件收束到 320px，中等容器 480px，宽控件 600px，不拉成通栏长条 */ .play.ly-center, .play.ly-field, .play.ly-med, .play.ly-wide { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; } .play.ly-center > sn-enhance { display: flex; flex-direction: column; align-items: center; gap: 16px; max-width: 100%; } .play.ly-center .sn-row { justify-content: center; } .play.ly-center .sn-t-body { text-align: center; } .play.ly-center > .sn-pc, .play.ly-center > sn-enhance > .sn-pc { width: 100%; max-width: 280px; } .play.ly-center:has(.sn-bottom-bar) { align-items: stretch; } .play.ly-center:has(.sn-bottom-bar) > sn-enhance { display: block; width: 100%; } .play.ly-field > :not(script):not(style) { width: 100%; max-width: 320px; } .play.ly-field > sn-enhance { display: block; width: 100%; max-width: 320px; } .play.ly-field .sn-pk, .play.ly-field .sn-select { width: 100%; } .play.ly-med > :not(script):not(style) { width: 100%; max-width: 480px; } .play.ly-med > sn-enhance { display: block; width: 100%; max-width: 480px; } .play.ly-wide > :not(script):not(style) { width: 100%; max-width: 600px; } .play.ly-wide > sn-enhance { display: block; width: 100%; max-width: 600px; } /* ?phone=1（官网的手机设备框）：内容区撑满屏幕、能滚，贴底操作栏落在屏幕最下面（两边、底下贴边），别的照旧从上往下排 */ html.phone { overflow: auto; } .play.phone { min-height: 100dvh; box-sizing: border-box; display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start; } .play.phone > sn-enhance { display: contents; } .play.phone .sn-bottom-bar { margin: auto -24px -24px; } /* <script type="importmap">{"imports":{"satin-ui":"../../packages/satin-ui/src/index.js","satin-ui/components":"../../packages/satin-ui/src/components.js","satin-ui/elements":"../../packages/satin-ui/elements/index.js","satin-ui/theme":"../../packages/satin-ui/src/theme.js","satin-ui/icons":"../../packages/satin-ui/src/icons.js","satin-ui/markdown":"../../packages/satin-ui/src/markdown.js","satin-ui/chat":"../../packages/satin-ui/src/chat.js","satin-ui/flow":"../../packages/satin-ui/src/flow.js","satin-ui/grid":"../../packages/satin-ui/src/grid.js","satin-ui/canvas-grid":"../../packages/satin-ui/src/canvas-grid.js","satin-ui/charts":"../../packages/satin-ui/src/charts.js","satin-ui/lightbox":"../../packages/satin-ui/src/lightbox.js","satin-ui/media":"../../packages/satin-ui/src/media.js","satin-ui/tree":"../../packages/satin-ui/src/tree.js"}}</script>

<body>
<main class="play"></main>
<script type="module">
// 页面入口：页面级行为和自定义元素先装好（演示的片段里不再写）
import { setup } from "satin-ui";
import { toast } from "satin-ui/components";
import { defineElements } from "satin-ui/elements";
setup(); defineElements();
// 演示沙箱保护：拦截未处理的站内占位链接与默认表单提交，避免在 iframe 预览里误跳出 404
document.addEventListener("click", (e) => {
  if (e.defaultPrevented) return;
  const a = e.target.closest?.("a[href]");
  if (!a || a.target === "_blank" || a.hasAttribute("download")) return;
  const href = a.getAttribute("href") || "";
  if (/^(?:https?:|mailto:|tel:|javascript:)/i.test(href)) return;
  e.preventDefault();
  if (href.startsWith("#")) { if (href.length > 1) document.getElementById(href.slice(1))?.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  toast({ text: "演示链接 · " + href, tone: "info" });
});
document.addEventListener("submit", (e) => { if (!e.defaultPrevented) e.preventDefault(); });
// 演示的片段（demos/<slug>.html）：标记放进来，模块脚本照原样跑——和复制到自己页面里一样；跑出错了写清楚，不留白
const run = (box, code) => { const url = URL.createObjectURL(new Blob([code], { type: "text/javascript" })); import(url).catch((e) => { console.error("演示 " + box.dataset.demo + " 出错：", e); const p = document.createElement("p"); p.className = "demo-err"; p.textContent = "演示出错：" + String(e?.message ?? e); box.append(p); }).finally(() => URL.revokeObjectURL(url)); };
const q = new URLSearchParams(location.search), slug = q.get("demo"), box = document.querySelector(".play"), ly = q.get("layout");
if (q.get("center")) box.classList.add("center");
if (q.get("flush")) box.classList.add("flush");
if (q.get("phone")) { box.classList.add("phone"); document.documentElement.classList.add("phone"); }
else if (ly && /^(center|field|med|wide)$/.test(ly)) box.classList.add("ly-" + ly);
if (slug && /^[a-z0-9-]+$/.test(slug)) {
  const html = await (await fetch("demos/" + slug + ".html")).text();
  const tp = document.createElement("template"); tp.innerHTML = html;
  const scripts = [...tp.content.querySelectorAll("script")]; for (const s of scripts) s.remove();
  box.append(tp.content);
  for (const s of scripts) run(box, s.textContent);
}
const send = () => parent.postMessage({ satinEmbed: slug, h: Math.ceil(box.offsetHeight) }, location.origin);
new ResizeObserver(send).observe(box); send();
document.documentElement.dataset.ready = "1";
</script>
