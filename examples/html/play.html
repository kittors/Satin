<style>html { overflow: hidden; } html, body { background: transparent !important; } .play { padding: 24px; } .play.center > sn-enhance > * { margin-inline: auto; } /* ?phone=1（官网的手机设备框）：内容区撑满屏幕、能滚，贴底操作栏落在屏幕最下面（两边、底下贴边），别的照旧从上往下排 */ html.phone { overflow: auto; } .play.phone { min-height: 100dvh; box-sizing: border-box; display: flex; flex-direction: column; } .play.phone > sn-enhance { display: contents; } .play.phone .sn-bottom-bar { margin: auto -24px -24px; } /* 填满容器的组件（对话）：演示框给它高度——桌面 600 高；手机设备框里铺满整屏（不留四周的 24px，像手机应用） */ .play .sn-chat { height: 600px; } .play.phone:has(.sn-chat) { height: 100dvh; padding: 0; } .play.phone > :has(.sn-chat) { flex: 1; min-height: 0; display: flex; flex-direction: column; } .play.phone .sn-chat { flex: 1; height: auto; min-height: 0; } .demo-err { margin: 0; padding: 10px 12px; border-radius: var(--sn-r-md); box-shadow: inset 0 0 0 1px var(--sn-danger); color: var(--sn-danger); font: 400 calc(13px * var(--sn-font-scale, 1))/calc(20px * var(--sn-font-scale, 1)) var(--sn-sans); }</style>
<script type="importmap">{"imports":{"satin-ui":"../../packages/satin-ui/src/index.js","satin-ui/components":"../../packages/satin-ui/src/components.js","satin-ui/elements":"../../packages/satin-ui/elements/index.js","satin-ui/theme":"../../packages/satin-ui/src/theme.js","satin-ui/icons":"../../packages/satin-ui/src/icons.js","satin-ui/markdown":"../../packages/satin-ui/src/markdown.js","satin-ui/chat":"../../packages/satin-ui/src/chat.js","satin-ui/flow":"../../packages/satin-ui/src/flow.js","satin-ui/grid":"../../packages/satin-ui/src/grid.js","satin-ui/canvas-grid":"../../packages/satin-ui/src/canvas-grid.js","satin-ui/lightbox":"../../packages/satin-ui/src/lightbox.js","satin-ui/media":"../../packages/satin-ui/src/media.js"}}</script>

<body>
<main class="play"></main>
<script type="module">
// 页面入口：页面级行为和自定义元素先装好（演示的片段里不再写）
import { setup } from "satin-ui";
import { defineElements } from "satin-ui/elements";
setup(); defineElements();
// 演示的片段（demos/<slug>.html）：标记放进来，模块脚本照原样跑——和复制到自己页面里一样；跑出错了写清楚，不留白
const run = (box, code) => { const url = URL.createObjectURL(new Blob([code], { type: "text/javascript" })); import(url).catch((e) => { console.error("演示 " + box.dataset.demo + " 出错：", e); const p = document.createElement("p"); p.className = "demo-err"; p.textContent = "演示出错：" + String(e?.message ?? e); box.append(p); }).finally(() => URL.revokeObjectURL(url)); };
const q = new URLSearchParams(location.search), slug = q.get("demo"), box = document.querySelector(".play");
if (q.get("center")) box.classList.add("center");
if (q.get("phone")) { box.classList.add("phone"); document.documentElement.classList.add("phone"); }
if (slug && /^[a-z0-9-]+$/.test(slug)) {
  const html = await (await fetch("demos/" + slug + ".html")).text();
  const tp = document.createElement("template"); tp.innerHTML = html;
  const scripts = [...tp.content.querySelectorAll("script")]; for (const s of scripts) s.remove();
  box.append(tp.content);
  for (const s of scripts) run(box, s.textContent);
}
const send = () => parent.postMessage({ satinEmbed: slug, h: Math.ceil(box.getBoundingClientRect().bottom) }, location.origin);
new ResizeObserver(send).observe(box); send();
document.documentElement.dataset.ready = "1";
</script>
