<sn-enhance id="demo-segmented-0">
  <div class="row" style="gap:24px">
    <div class="sn-seg" data-seg="a">
      <span class="sn-thumb"></span>
      <button>验证码登录</button>
      <button>密码登录</button>
    </div>
    <div class="sn-seg" data-seg="b">
      <span class="sn-thumb"></span>
      <button>网格</button>
      <button>列表</button>
      <button>时间线</button>
    </div>
    <div class="sn-seg sn-sm" data-seg="c">
      <span class="sn-thumb"></span>
      <button>7 天</button>
      <button>30 天</button>
      <button>90 天</button>
      <button>全部</button>
    </div>
  </div>
</sn-enhance>

<script type="module">
  import { defineElements } from "satin-ui/elements";
  import { createSegmented } from "satin-ui/components";

  defineElements(); // <sn-enhance> 放进页面就接上交互；也注册 <sn-segmented>、<sn-select> 这些组件元素
  const root = document.getElementById("demo-segmented-0");
  // 在已有的标记上接交互；给空容器时按 items、value 渲染
  const segEl = root.querySelector(".sn-seg");
  if (segEl) {
    const seg = createSegmented(segEl, {
      onChange: (value) => console.log("选中了", value),
    });
    seg.select("9:16"); // 从外面切过去
  }
</script>

<style>
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  .row + .row { margin-top: 16px; }
  .sn-nf-card .row { display: flex; flex-wrap: wrap; gap: 6px; }
</style>
